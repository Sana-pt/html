<html>
<head>
<title>Bgcolor</title>
<body>
<h1>Change Background</h1>
<button onclick="changeColor()">change</button>
<script>
let colors=["yellow","pink","grey","green"]
let i=0;
function changeColor(){
document.body.style.backgroundColor=colors[i];
i++;
if(i==colors.length){
i=0;
}
}
</script>
</body>
</html>
