<!DOCTYPE html>
<html>
<head>
<title>Form page</title>
<style>
body
{ 
  background-color:lightyellow;
  text-align:center;
}

</style>
</head>
<body>
<h2 style="color:green"><center><u>STUDENT REGISTRATION FORM</u></center></h2>
<form>

<label>Name:</label>
<input type="text"name="name">
<br><br>

<label>Email:</label>
<input type="email"name="email">
<br><br>

<label>Password:</label>
<input type="password"name="password">
<br><br>

<label>Age:</label>
<input type="number"name="age">
<br><br>

<label>Gender:</label><br>
<input type="radio" name="gender" value="Male">Male<br>
<input type="radio" name="gender" value="Female">Female
<br><br>

<label>Course:</label>
<select name="course">
    <option>MCA</option>
    <option>MBA</option>
    <option>M.Tech</option>
    <option>BCA</option>
</select>
<br><br>

<label>Hobbies:</label>
<input type="checkbox" name="hobby" value="writing">Writing
<input type="checkbox" name="hobby" value="reading">Reading
<input type="checkbox" name="hobby" value="music">Music
<br><br>

<label>Address:</label>
<textarea name="address" rows="4" cols="30"></textarea>
<br><br>

<label>Date of Birth:</label>
<input type="Date" name="dob">
<br><br>

<input type="submit" value="Register" style="color:white;background-color:blue">
<input type="reset" value="Clear"  style="color:white;background-color:red">

</form
</body>
</html>
