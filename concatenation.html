<html>
<head><title>Math function</title></head>
<body style="background-color:pink;">

<h1><b><i><center>MATH AND STRING FUNCTIONS</center></i></b></h1>


<script>
var a="Hello";
var b=20;
var c=26;
document.write("<h3><u>Math functions</u></h3>");
document.write("string1=" + a + "<br><br>");
document.write("string2=" + b + "<br><br>");
document.write("string3=" + c + "<br><br>");
document.write("<h3><u>String functions</u></h3>");
var d=a+b+c;
document.write("1.concatenation string: " + d +"<br><br>");
document.write("2.String length:" + a.length + "<br><br>");
document.write("3.Uppercase=" + a.toUpperCase() + "<br><br>");
document.write("4.Lowercase=" + a.toLowerCase() + "<br><br>");
document.write("5.Round=" + Math.round(4.6) + "<br><br>");
document.write("5.Floor=" + Math.floor(4.9) + "<br><br>");
document.write("6.Replace of the string:" + a.replace(a,b) + "<br><br>");
document.write("7.Ceil=" + Math.ceil(4.1) + "<br><br>");
document.write("8.Square Root=" + Math.sqrt(25) + "<br><br>");
document.write("9.Power=" + Math.pow(2,3) + "<br><br>");
document.write("10.Absolute=" + Math.abs(-10) + "<br><br>");
document.write("11.Maximum=" + Math.max(10,20,30) + "<br><br>");
document.write("12.Minimum=" + Math.min(10,20,30) + "<br><br>");

</script>
</body>	
</html>
